name: MiniLedger CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: miniledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting Check
        run: npm run format:check

      - name: Build Shared Package
        run: npm run build --workspace=@miniledger/shared

      - name: TypeScript Typecheck All Packages
        run: npm run typecheck

      - name: Generate Prisma Client & Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/miniledger_test?schema=public
        run: |
          npm run --workspace=@miniledger/api db:generate
          npx prisma migrate deploy --schema=services/api/prisma/schema.prisma

      - name: Run Backend Tests (Unit & Integration)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/miniledger_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/miniledger_test?schema=public
          JWT_ACCESS_SECRET: miniledger_ci_access_secret_super_secure_key_at_least_32_chars
          JWT_REFRESH_SECRET: miniledger_ci_refresh_secret_super_secure_key_at_least_32_chars
          ENABLE_DEV_OTP: "true"
        run: npm run --workspace=@miniledger/api test

      - name: Run Mobile Unit Tests
        run: npm run --workspace=@miniledger/mobile test

      - name: Build API Bundle
        run: npm run --workspace=@miniledger/api build
