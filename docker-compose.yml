services:
  db:
    image: postgres:16-alpine
    container_name: miniledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miniledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: miniledger-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/miniledger?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_a_secure_random_64_character_hex_secret_miniledger}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_a_secure_random_64_character_hex_secret_miniledger_refresh}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 30
      ENABLE_DEV_OTP: "false"
      CORS_ORIGIN: "*"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - miniledger_uploads:/app/uploads

volumes:
  miniledger_pgdata:
  miniledger_uploads:
